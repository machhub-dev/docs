<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="MACHHUB">
  <defs>
    <linearGradient id="mh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b76e8"/>
      <stop offset="1" stop-color="#3b46b8"/>
    </linearGradient>
  </defs>
  <!-- central hub -->
  <circle cx="24" cy="24" r="6" fill="url(#mh)"/>
  <!-- spokes + nodes (unified namespace / data fabric motif) -->
  <g fill="url(#mh)">
    <circle cx="24" cy="6" r="3.5"/>
    <circle cx="42" cy="24" r="3.5"/>
    <circle cx="24" cy="42" r="3.5"/>
    <circle cx="6" cy="24" r="3.5"/>
  </g>
  <g stroke="url(#mh)" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="12" x2="24" y2="18"/>
    <line x1="36" y1="24" x2="30" y2="24"/>
    <line x1="24" y1="36" x2="24" y2="30"/>
    <line x1="12" y1="24" x2="18" y2="24"/>
  </g>
</svg>
